[package]
name = "system-gate"
version = "0.1.0"
description = "Block distracting sites and apps until your Google Tasks are done."
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }  # tray: app keeps running when the window is closed
tauri-plugin-single-instance = "2"   # never run two enforcers (autostart + manual launch)
tauri-plugin-notification = "2"    # desktop notifications
tauri-plugin-autostart = "2"         # launch at OS login
tauri-plugin-opener = "2"          # opens the OAuth consent page in the default browser
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "process", "sync", "macros"] }
sha2 = "0.10"                      # PKCE code challenge
base64 = "0.22"
rand = "0.8"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }  # local dates + RFC 3339 parsing

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
